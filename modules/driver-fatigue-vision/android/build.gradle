plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.driverfatiguevision'
version = '0.1.0'

android {
  namespace "expo.modules.driverfatiguevision"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    // Share one checked-in model with the iOS CocoaPods resource bundle.
    main.assets.srcDirs += ['../ios/Resources']
  }
  androidResources {
    noCompress 'task'
  }
}

dependencies {
  def camerax_version = '1.6.2'

  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
