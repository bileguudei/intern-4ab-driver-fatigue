name = "driver-fatigue-backend"
main = "src/index.ts"
compatibility_date = "2026-09-17"

[[d1_databases]]
binding = "DB"
database_name = "driver-fatigue-db"
database_id = "cb5407bc-f2ad-4d17-a3be-07f1777d8c69"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "driver-fatigue-media"

[[r2_buckets]]
binding = "KNOWLEDGE"
bucket_name = "driver-fatigue-knowledge"

[[vectorize]]
binding = "VECTORIZE"
index_name = "driver-fatigue-knowledge"
remote = true

# GEMINI_API_KEY and INGEST_API_KEY are secrets, not vars — set them with:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put INGEST_API_KEY
# For local dev, put them in backend/.dev.vars (gitignored) instead.